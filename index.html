<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>Number to 20 Cookie Shop</title>

  <link rel="preload" as="image" href="ChatGPT Image Apr 7, 2026, 08_23_33 PM.png" fetchpriority="high" />
  <link rel="preload" as="audio" href="synthesize (2).mp3" type="audio/mpeg" />

  <style>
    :root{
      --text:#fffaf4;
      --text-soft:#fff0cf;
      --brown-1:#7a4324;
      --brown-2:#4d2814;
      --gold-1:#ffe36a;
      --gold-2:#ffb631;
      --pink-1:#ff8daf;
      --pink-2:#ff5f8a;
      --glass:rgba(255,255,255,.14);
      --glass-stroke:rgba(255,255,255,.24);
      --shadow:0 18px 42px rgba(51, 27, 11, 0.28);
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      width:100%;
      min-height:100%;
      font-family:"Arial Rounded MT Bold","Trebuchet MS","Comic Sans MS",sans-serif;
      overflow:hidden;
      background:linear-gradient(180deg, #74d1ff 0%, #6dc76a 100%);
    }

    body{
      min-height:100vh;
      min-height:100dvh;
    }

    .page{
      position:relative;
      min-height:100vh;
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      overflow:hidden;
      isolation:isolate;
    }

    .bg{
      position:absolute;
      inset:0;
      background-image:url("ChatGPT Image Apr 7, 2026, 08_23_33 PM.png");
      background-size:cover;
      background-position:center;
      transform:scale(1.1);
      filter:blur(24px) saturate(1.08);
      opacity:.45;
      z-index:-3;
    }

    .bg-overlay{
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03)),
        radial-gradient(circle at top, rgba(255,255,255,.24), transparent 34%),
        linear-gradient(180deg, rgba(105,67,27,.18), rgba(59,34,18,.28));
      z-index:-2;
    }

    .sprinkles{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:-1;
    }

    .sprinkles span{
      position:absolute;
      width:10px;
      height:10px;
      border-radius:50%;
      background:rgba(255,255,255,.9);
      box-shadow:0 0 14px rgba(255,255,255,.95);
      animation:twinkle 3.2s ease-in-out infinite;
    }

    .sprinkles span:nth-child(1){ top:8%; left:9%; animation-delay:.2s; }
    .sprinkles span:nth-child(2){ top:11%; right:14%; animation-delay:1.1s; }
    .sprinkles span:nth-child(3){ top:24%; left:83%; animation-delay:2s; }
    .sprinkles span:nth-child(4){ top:69%; left:8%; animation-delay:1.5s; }
    .sprinkles span:nth-child(5){ top:85%; right:11%; animation-delay:.7s; }
    .sprinkles span:nth-child(6){ top:56%; right:17%; animation-delay:2.4s; }

    @keyframes twinkle{
      0%,100%{ transform:scale(.6); opacity:.45; }
      50%{ transform:scale(1.28); opacity:1; }
    }

    .panel{
      width:min(100%, 780px);
      min-height:min(96dvh, 940px);
      border-radius:30px;
      background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.09));
      border:1px solid var(--glass-stroke);
      backdrop-filter:blur(12px);
      box-shadow:var(--shadow);
      overflow:hidden;
      position:relative;
      display:grid;
      grid-template-rows:auto auto auto 1fr auto auto auto;
      gap:14px;
      padding:18px 18px max(16px, calc(env(safe-area-inset-bottom) + 8px));
    }

    .panel::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 10%, rgba(255,255,255,.20), transparent 30%),
        linear-gradient(180deg, rgba(255,255,255,.06), transparent 35%);
    }

    .top-hint{
      position:relative;
      z-index:1;
      margin:2px auto 0;
      width:max-content;
      max-width:100%;
      text-align:center;
      padding:10px 16px;
      border-radius:999px;
      background:rgba(90, 50, 25, .30);
      color:var(--text-soft);
      font-size:clamp(12px, 2vw, 15px);
      font-weight:800;
      box-shadow:0 0 0 1px rgba(255,255,255,.10) inset;
    }

    .title-wrap{
      position:relative;
      z-index:1;
      text-align:center;
      display:grid;
      gap:8px;
      padding:2px 8px 0;
    }

    .eyebrow{
      font-size:clamp(13px, 2.2vw, 16px);
      color:#fff3a8;
      font-weight:900;
      letter-spacing:.8px;
      text-transform:uppercase;
      text-shadow:0 2px 0 rgba(0,0,0,.15);
    }

    h1{
      margin:0;
      color:var(--text);
      font-size:clamp(32px, 5.8vw, 60px);
      line-height:.95;
      text-shadow:0 4px 0 rgba(94, 49, 22, .22);
    }

    .sub{
      margin:0 auto;
      max-width:24ch;
      color:#fff8ea;
      font-size:clamp(16px, 2.6vw, 22px);
      line-height:1.25;
      text-shadow:0 2px 0 rgba(0,0,0,.12);
    }

    .buttons{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:12px;
      padding:0 6px;
      max-width:520px;
      width:100%;
      margin:0 auto;
    }

    .art-wrap{
      position:relative;
      z-index:1;
      display:grid;
      place-items:center;
      min-height:0;
      padding:4px 4px 0;
    }

    .art-frame{
      position:relative;
      width:100%;
      height:100%;
      min-height:320px;
      max-height:min(58dvh, 630px);
      border-radius:26px;
      overflow:hidden;
      background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.08));
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.20),
        0 12px 30px rgba(0,0,0,.14);
      display:grid;
      place-items:center;
    }

    .art-frame::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 10%, rgba(255,255,255,.24), transparent 28%),
        linear-gradient(180deg, rgba(255,255,255,.10), transparent 35%);
      z-index:1;
    }

    .art-bg{
      position:absolute;
      inset:0;
      background-image:url("ChatGPT Image Apr 7, 2026, 08_23_33 PM.png");
      background-size:cover;
      background-position:center;
      filter:blur(20px) brightness(.95);
      transform:scale(1.05);
      opacity:.34;
    }

    .art{
      position:relative;
      z-index:2;
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
      padding:10px;
      filter:drop-shadow(0 10px 18px rgba(0,0,0,.18));
    }

    .feature-row{
      position:relative;
      z-index:1;
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:10px;
      padding:0 6px;
    }

    .pill{
      padding:10px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.17);
      color:#fff;
      font-size:clamp(12px, 2vw, 15px);
      font-weight:800;
      box-shadow:0 0 0 1px rgba(255,255,255,.10) inset;
    }

    .btn{
      appearance:none;
      border:none;
      border-radius:20px;
      min-height:60px;
      padding:12px 16px;
      cursor:pointer;
      font-family:inherit;
      font-weight:900;
      font-size:clamp(18px, 2.5vw, 22px);
      line-height:1.08;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      text-align:center;
      transition:transform .12s ease, filter .12s ease, box-shadow .12s ease, opacity .16s ease;
      box-shadow:
        0 8px 0 rgba(0,0,0,.14),
        0 12px 20px rgba(0,0,0,.16),
        inset 0 2px 0 rgba(255,255,255,.45);
      background:linear-gradient(180deg, var(--gold-1), var(--gold-2));
      color:var(--brown-2);
      text-shadow:0 1px 0 rgba(255,255,255,.35);
    }

    .btn:hover{
      transform:translateY(-2px) scale(1.01);
      filter:brightness(1.03);
    }

    .btn:active{
      transform:translateY(5px) scale(.995);
      box-shadow:
        0 5px 0 rgba(0,0,0,.14),
        0 10px 16px rgba(0,0,0,.14),
        inset 0 2px 0 rgba(255,255,255,.40);
    }

    .btn[disabled]{
      cursor:default;
      opacity:.78;
      transform:none;
      filter:none;
    }

    .status{
      position:relative;
      z-index:1;
      min-height:22px;
      text-align:center;
      color:#fff2bf;
      font-size:clamp(13px, 2vw, 16px);
      font-weight:800;
      text-shadow:0 1px 0 rgba(0,0,0,.18);
      opacity:0;
      transition:opacity .2s ease;
    }

    .status.show{
      opacity:1;
    }

    .credit{
      position:relative;
      z-index:1;
      text-align:center;
      font-size:12px;
      color:rgba(255,255,255,.95);
      text-shadow:0 1px 2px rgba(0,0,0,.22);
    }

    @media (max-width: 700px){
      .panel{
        width:min(100%, 560px);
        border-radius:24px;
        padding:14px 14px max(14px, calc(env(safe-area-inset-bottom) + 6px));
        gap:12px;
      }

      .art-frame{
        border-radius:20px;
        min-height:240px;
        max-height:min(40dvh, 340px);
      }

      .btn{
        min-height:54px;
        padding:10px 12px;
        border-radius:16px;
        font-size:16px;
      }
    }

    @media (max-height: 760px){
      .panel{
        gap:10px;
      }

      .art-frame{
        max-height:min(42dvh, 360px);
      }

      .btn{
        min-height:52px;
      }
    }

    @media (max-height: 620px){
      .panel{
        min-height:min(98dvh, 620px);
      }

      h1{
        font-size:clamp(26px, 5.1vw, 44px);
      }

      .sub{
        font-size:clamp(14px, 2.1vw, 18px);
      }

      .top-hint,
      .pill,
      .status{
        font-size:12px;
      }

      .art-frame{
        min-height:190px;
        max-height:min(30dvh, 240px);
      }

      .btn{
        min-height:46px;
        font-size:15px;
        padding:8px 10px;
      }

      .credit{
        font-size:11px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="bg"></div>
    <div class="bg-overlay"></div>

    <div class="sprinkles" aria-hidden="true">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>

    <main class="panel">
      <div class="top-hint">Tap Desktop or Mobile to open your cookie number game</div>

      <section class="title-wrap">
        <div class="eyebrow">Cute Art + Kid-Friendly Number Practice</div>
        <h1>Number to 20 Cookie Shop</h1>
        <p class="sub">Learn numbers and have fun in the cookie shop!</p>
      </section>

      <section class="buttons">
        <button class="btn" id="desktopBtn" type="button" aria-label="Open desktop Number to 20 Cookie Shop">
          <span>🖥️</span>
          <span>Desktop</span>
        </button>

        <button class="btn" id="mobileBtn" type="button" aria-label="Open mobile Number to 20 Cookie Shop">
          <span>📱</span>
          <span>Mobile</span>
        </button>
      </section>

      <section class="art-wrap">
        <div class="art-frame" aria-label="Number to 20 Cookie Shop cover image">
          <div class="art-bg"></div>
          <img
            class="art"
            src="ChatGPT Image Apr 7, 2026, 08_23_33 PM.png"
            alt="Number to 20 Cookie Shop cover image"
          />
        </div>
      </section>

      <section class="feature-row">
        <div class="pill">🍪 Number fun to 20</div>
        <div class="pill">🎈 Bright and friendly</div>
        <div class="pill">📱 Mobile ready</div>
      </section>

      <div class="status" id="statusText" aria-live="polite"></div>
      <div class="credit">Designed by Lim Kim Sze © 2026</div>
    </main>
  </div>

  <audio id="openingAudio" preload="auto" playsinline>
    <source src="synthesize (2).mp3" type="audio/mpeg" />
  </audio>

  <script>
    const DESKTOP_LINK = "https://limkimsze-maker.github.io/P1-Number-to-20-Cookie-Shop/";
    const MOBILE_LINK = "https://limkimsze-maker.github.io/Number-to-20-Cookie-Shop-Mobile/";

    const desktopBtn = document.getElementById("desktopBtn");
    const mobileBtn = document.getElementById("mobileBtn");
    const statusText = document.getElementById("statusText");
    const openingAudio = document.getElementById("openingAudio");

    let opening = false;
    openingAudio.load();

    function showStatus(message) {
      statusText.textContent = message;
      statusText.classList.add("show");
    }

    function disableButtons() {
      desktopBtn.disabled = true;
      mobileBtn.disabled = true;
    }

    function goTo(link) {
      window.location.href = link;
    }

    function openGame(link, label) {
      if (opening) return;
      opening = true;

      disableButtons();
      showStatus(`Opening ${label}...`);

      openingAudio.pause();
      openingAudio.currentTime = 0;

      openingAudio.addEventListener("ended", () => {
        goTo(link);
      }, { once:true });

      openingAudio.play().catch(() => {
        goTo(link);
      });
    }

    desktopBtn.addEventListener("click", () => openGame(DESKTOP_LINK, "Desktop"));
    mobileBtn.addEventListener("click", () => openGame(MOBILE_LINK, "Mobile"));
  </script>
</body>
</html>
